name: waad
description: مجاهد — تطبيق ورد قرآني يومي
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  qcf_quran: ^0.0.5
  flutter_screenutil: ^5.9.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  adhan: ^2.0.0+1
  geolocator: ^14.1.1
  http: ^1.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#0F3D2E"
  adaptive_icon_foreground: "icon_fg.png"
  min_sdk_android: 24
